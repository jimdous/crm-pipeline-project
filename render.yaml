services:
  - type: web
    name: crm-pipeline-v2
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.init_db --seed-on-create && uvicorn backend.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        fromDatabase:
          name: crm-pipeline-v2-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: PUBLIC_DEMO
        value: "true"
databases:
  - name: crm-pipeline-v2-db
    plan: free
    postgresMajorVersion: "17"
    databaseName: crm_pipeline
    user: crm_app
    ipAllowList: []
